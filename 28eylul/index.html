      const urun =async() =>{
        try{
          console.log("Harici Api'ye bağlanılıyor");
          const response = await fetch("https://dummyjson.com/products");
          if(!response.ok){
            throw new Error(`http Hatası: ${response.status}`);
          }
          const data =await response.json();
          console.log(`Toplam ${data.products.length} kadar ürün çekildi.`);

          const vitrin = data.products.slice(2,7).map(p => ({    urun: p.title,
            aciklama: p.description,
            kategori: p.category,
            fiyat: p.price,
            stok: p.stock,
            etiket: p.tags,}));
          console.log(vitrin);
        }catch(err){
          console.warn("Api Hatası", err.message);
        }
      }
