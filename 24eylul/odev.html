<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şarj Süresi Tahmini</title>
  </head>
  <body>
    <script>
      const GUNDUZ_TARIFE = 8.5;
      const GECE_TARIFE = 5.5;
      const GUNDUZ_BASLANGIC = 6;
      const GECE_BASLANGIC = 22;

      const tarifeBelirle = (saat) =>
        saat >= GUNDUZ_BASLANGIC && saat < GECE_BASLANGIC
          ? { ad: "Gündüz", fiyat: GUNDUZ_TARIFE }
          : { ad: "Gece", fiyat: GECE_TARIFE };

      const sarjSuresiHesapla = (mevcutYuzde, hedefYuzde, bataryaKw, istasyonKw) => {
        if (mevcutYuzde < 0 || hedefYuzde > 100) {
          return "Yüzde değerleri 0 ile 100 arasında olmalı!";
        }
        if (hedefYuzde <= mevcutYuzde) {
          return "Hedef yüzde, mevcut yüzdeden büyük olmalı!";
        }
        if (bataryaKw <= 0 || istasyonKw <= 0) {
          return "Batarya ve istasyon değerleri 0'dan büyük olmalı!";
        }

        const doldurulacakEnerji = (bataryaKw * (hedefYuzde - mevcutYuzde)) / 100;
        const saat = doldurulacakEnerji / istasyonKw;
        const dakika = Math.round(saat * 60);

        const simdi = new Date();
        const tarife = tarifeBelirle(simdi.getHours());
        const maliyet = (doldurulacakEnerji * tarife.fiyat).toFixed(2);
        const saatMetni = simdi.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });

        return `%${mevcutYuzde} → %${hedefYuzde} | ${bataryaKw} kWh batarya, ${istasyonKw} kW istasyon → Tahmini Süre: ${dakika} dakika | Saat: ${saatMetni} (${tarife.ad} tarifesi, ${tarife.fiyat} ₺/kWh) → Maliyet: ${maliyet} ₺`;
      };

      console.log(sarjSuresiHesapla(20, 80, 88.5, 150));
      console.log(sarjSuresiHesapla(20, 80, 88.5, 7));
      console.log(sarjSuresiHesapla(80, 20, 88.5, 150));
    </script>
  </body>
</html>
