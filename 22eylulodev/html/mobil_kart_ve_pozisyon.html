<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Pozisyonlama Mimarisi</title>
    <link rel="stylesheet" href="../css/mobil_kart_ve_pozisyon.css">
  </head>
  <body>
    <header class="mobile-header">Keşfet & Alışveriş Yap</header>
    <main class="feed">
      <div class="product-card">
        <span class="badge-discount">%40 İNDİRİM</span>
        <h3>Kablosuz Kulaklık</h3>
        <p style="color: #94a3b8; margin: 8px 0 16px">
          Aktif gürültü engelleme & 100 saatlik pil ömrü
        </p>
        <strong style="color: #38bdf8; font-size: 20px">1.500 ₺</strong>
      </div>

      <div class="product-card">
        <span class="badge-discount" style="background: #10b981">Yeni</span>
        <h3>Akıllı Saat</h3>
        <p style="color: #94a3b8; margin: 8px 0 16px">
          Nabız Ölçümü & tansiyon ölçümü
        </p>
        <strong style="color: #38bdf8; font-size: 20px">799 ₺ </strong>
      </div>

      <button class="fab-btn">+</button>
      <nav class="bottom-nav">
        <span>Anasayfa</span>
        <span>Arama</span>
        <span>Sepetim</span>
        <span>Profil</span>
      </nav>
    </main>
  </body>
</html>
