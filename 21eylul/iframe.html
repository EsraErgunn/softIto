<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        background: khaki;
        padding: 20px;
        max-width: 600px;
        margin: auto;
      }
      .card {
        background-color: blueviolet;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 52px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      h3 {
        margin-top: 0;
        color: #1e293b;
      }
      iframe {
        width: 100%;
        border-radius: 8px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>İframe Harita ve Video</h3>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/ig8uqTUKDzo?si=VfkWDfKw2435L9zU"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <br />
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d96356.81569972813!2d29.20758581761475!3d41.00007921842594!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cad30828fd6951%3A0x753b5ae19214ae39!2sPark%20of%20istanbul!5e0!3m2!1str!2str!4v1789995742046!5m2!1str!2str"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </body>
</html>
